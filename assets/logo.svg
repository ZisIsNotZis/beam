<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">beam</title>
  <desc id="desc">A starting token branching into three candidate sequences.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)"/>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".12"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 64 H56" stroke="url(#warm)" stroke-width="6"/>
    <path d="M56 64 C68 64 66 38 82 38 L98 38" stroke="url(#warm)" stroke-width="5"/>
    <path d="M56 64 H98" stroke="url(#rose)" stroke-width="5"/>
    <path d="M56 64 C68 64 66 90 82 90 L98 90" stroke="url(#cyan)" stroke-width="5"/>
  </g>

  <g>
    <circle cx="34" cy="64" r="8" fill="#fef3c7"/>
    <circle cx="34" cy="64" r="13" fill="none" stroke="#fef3c7" stroke-opacity=".28" stroke-width="2"/>
    <circle cx="98" cy="38" r="5.5" fill="#fbbf24"/>
    <circle cx="98" cy="64" r="5.5" fill="#fb7185"/>
    <circle cx="98" cy="90" r="5.5" fill="#22d3ee"/>
  </g>

  <g fill="#ffffff" opacity=".5">
    <circle cx="108" cy="38" r="2"/>
    <circle cx="108" cy="64" r="2"/>
    <circle cx="108" cy="90" r="2"/>
  </g>
</svg>
